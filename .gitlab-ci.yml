stages:
  - push_unstable
  - push_stable

variables:
  IMAGE_NAME_UNSTABLE: "${CI_REGISTRY_NAME_UNSTABLE}/${CI_PROJECT_NAME}"
  IMAGE_NAME_STABLE: "${CI_REGISTRY_NAME_STABLE}/${CI_PROJECT_NAME}"


push_unstable:
  stage: push_unstable
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - echo "$DOCKER_AUTH_CONFIG" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR/" --dockerfile Dockerfile --cache-copy-layers --cache=true --build-arg "CI_COMMIT_TAG=$CI_COMMIT_TAG" --destination "${IMAGE_NAME_UNSTABLE}:${CI_COMMIT_TAG}"
  when: manual
  only:
    - tags

push_stable:
  stage: push_stable
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - echo "$DOCKER_AUTH_CONFIG" > /kaniko/.docker/config.json
    - echo "FROM ${IMAGE_NAME_UNSTABLE}:${CI_COMMIT_TAG}" > /workspace/Dockerfile
    - /kaniko/executor --context /workspace --dockerfile /workspace/Dockerfile --destination "${IMAGE_NAME_STABLE}:${CI_COMMIT_TAG}"
  when: manual
  only:
    - tags
