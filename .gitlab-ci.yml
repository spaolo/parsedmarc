stages:
  - init
  - push_unstable
  - push_stable

variables:
  IMAGE_NAME_UNSTABLE: "${CI_REGISTRY_NAME_UNSTABLE}/${CI_PROJECT_NAME}"
  IMAGE_NAME_STABLE: "${CI_REGISTRY_NAME_STABLE}/${CI_PROJECT_NAME}"
  DBIP_SOURCE: "https://download.db-ip.com/free"

# todo move download of https://download.db-ip.com/free/dbip-country-lite-2025-02.mmdb.gz to Dockerfile entrypoint
download_dbip:
  stage: init
  image: nexusrepo.aruba.it:5000/badouralix/curl-jq:latest
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
  script:
    - curl "${DBIP_SOURCE}/dbip-country-lite-$(date+ %Y-%m).mmdb.gz" -o dbip-country-lite.mmdb
  artifacts:
    expire_in: 12 hrs 
    paths:
      - dbip-country-lite.mmdb
  when: manual
  only:
    - tags
push_unstable:
  stage: push_unstable
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - download_dbip
  script:
    - echo "$DOCKER_AUTH_CONFIG" > /kaniko/.docker/config.json
    - mv dbip-country-lite.mmdb ./parsedmarc/resources/dbip/dbip-country-lite.mmdb
    - /kaniko/executor --context "$CI_PROJECT_DIR/" --dockerfile Dockerfile --cache-copy-layers --cache=true --build-arg "CI_COMMIT_TAG=$CI_COMMIT_TAG" --destination "${IMAGE_NAME_UNSTABLE}:${CI_COMMIT_TAG}"
  when: manual
  only:
    - tags

push_stable:
  stage: push_stable
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs:
    - download_dbip
  script:
    - echo "$DOCKER_AUTH_CONFIG" > /kaniko/.docker/config.json
    - echo "FROM ${IMAGE_NAME_UNSTABLE}:${CI_COMMIT_TAG}" > /workspace/Dockerfile
    - /kaniko/executor --context /workspace --dockerfile /workspace/Dockerfile --destination "${IMAGE_NAME_STABLE}:${CI_COMMIT_TAG}"
  when: manual
  only:
    - tags
